<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Job Tracker · Design preview</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #111b4b;
        --muted: #647092;
        --primary: #272b78;
        --primary-hover: #373cac;
        --lavender: #eeeaff;
        --lavender-strong: #b9aaf8;
        --blue: #dcecff;
        --blue-strong: #75aef3;
        --mint: #e5f5e9;
        --mint-strong: #6fb884;
        --peach: #fff0e6;
        --peach-strong: #f78f69;
        --rose: #ffe8ec;
        --surface: #fff;
        --canvas: #fcfbfa;
        --line: #e9e9ef;
        --shadow: 0 10px 28px rgb(28 29 66 / 4%);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--canvas); color: var(--ink); }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible {
        outline: 3px solid #8e80ed;
        outline-offset: 2px;
      }
      .icon { width: 20px; height: 20px; flex: none; vertical-align: middle; }
      .icon.small { width: 16px; height: 16px; }
      .icon.large { width: 26px; height: 26px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .shell { max-width: 1600px; margin: 0 auto; }
      .topbar {
        position: sticky; top: 0; z-index: 20; background: rgb(255 255 255 / 96%);
        border-bottom: 1px solid var(--line); box-shadow: 0 5px 20px rgb(28 29 66 / 3%);
        backdrop-filter: blur(12px);
      }
      .topbar-inner {
        max-width: 1600px; min-height: 72px; margin: auto; padding: 0 3%;
        display: flex; align-items: center; justify-content: space-between; gap: 20px;
      }
      .brand {
        white-space: nowrap; border: 0; background: none; padding: 0;
        color: var(--ink); font-family: Georgia, "Times New Roman", serif;
        font-size: 26px; letter-spacing: -.05em; font-weight: 700;
      }
      .nav { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .nav::-webkit-scrollbar { display: none; }
      .nav-button {
        display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        color: var(--ink); background: none; border: 0; border-radius: 12px;
        padding: 11px 13px; font-size: 14px; font-weight: 600;
      }
      .nav-button:hover, .nav-button[aria-current="page"] { background: var(--lavender); }
      .header-actions { display: flex; align-items: center; gap: 12px; }
      .avatar {
        display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
        background: var(--lavender); color: var(--ink); font-weight: 700; font-size: 13px;
      }
      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        min-height: 42px; padding: 0 17px; border: 1px solid var(--line);
        border-radius: 11px; background: white; color: var(--ink); font-size: 14px; font-weight: 650;
      }
      .button:hover { border-color: #c9c9df; background: #faf9ff; }
      .button.primary { color: white; background: var(--primary); border-color: var(--primary); }
      .button.primary:hover { background: var(--primary-hover); }
      .button.ghost { border-color: transparent; background: transparent; }
      .button.soft { background: var(--lavender); border-color: var(--lavender); }
      .button.icon-only { width: 42px; padding: 0; }
      main { padding: 27px 3% 56px; }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, .serif { font-family: Georgia, "Times New Roman", serif; letter-spacing: -.055em; }
      h1 { margin-bottom: 5px; font-size: clamp(36px, 3.7vw, 51px); line-height: 1.08; }
      h2 { margin-bottom: 0; font-size: 29px; line-height: 1.15; }
      h3 { margin-bottom: 0; font-size: 17px; letter-spacing: -.025em; }
      .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin: 0 0 22px; }
      .page-head p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
      .head-date { color: var(--muted); font-size: 14px; white-space: nowrap; margin-top: 12px; }
      .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .11em; text-transform: uppercase; font-weight: 800; }
      .grid { display: grid; gap: 16px; }
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 16px; }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
        box-shadow: var(--shadow); min-width: 0;
      }
      .card.pad { padding: 21px; }
      .metric {
        display: flex; align-items: center; gap: 19px; min-height: 112px; padding: 20px 22px;
      }
      .metric.lavender { background: linear-gradient(110deg, #f8f6ff, #fff); }
      .metric.mint { background: linear-gradient(110deg, #f4fbf6, #fff); }
      .metric.peach { background: linear-gradient(110deg, #fff8f3, #fff); }
      .metric.blue { background: linear-gradient(110deg, #f4f8ff, #fff); }
      .metric.rose { background: linear-gradient(110deg, #fff6f7, #fff); }
      .icon-tile {
        width: 54px; height: 54px; border-radius: 13px; display: grid; place-items: center;
        color: #6254d7; background: var(--lavender);
      }
      .mint .icon-tile, .icon-tile.mint { background: var(--mint); color: #317748; }
      .peach .icon-tile, .icon-tile.peach { background: var(--peach); color: #e56d42; }
      .blue .icon-tile, .icon-tile.blue { background: var(--blue); color: #3b84d9; }
      .rose .icon-tile, .icon-tile.rose { background: var(--rose); color: #d55b79; }
      .metric-body { min-width: 0; flex: 1; }
      .metric-label { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
      .metric-number { display: block; margin: 6px 0 0; font-size: 34px; line-height: 1; font-weight: 750; letter-spacing: -.05em; }
      .metric-note { margin-top: 7px; color: var(--muted); font-size: 12px; }
      .spark { width: 85px; height: 44px; flex: none; align-self: flex-end; }
      .dashboard-middle { grid-template-columns: minmax(300px, 1fr) minmax(0, 1.9fr); margin-bottom: 16px; }
      .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
      .section-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      .text-link {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 0;
        background: none; border: 0; color: #3033a0; font-size: 13px; font-weight: 650; white-space: nowrap;
      }
      .text-link:hover { text-decoration: underline; }
      .pipeline-row { display: grid; grid-template-columns: 12px minmax(105px, 1fr) 24px minmax(75px, 1.1fr); align-items: center; gap: 12px; margin: 17px 0; font-size: 14px; }
      .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--lavender-strong); }
      .dot.blue { background: var(--blue-strong); }
      .dot.mint { background: var(--mint-strong); }
      .dot.peach { background: #f6c571; }
      .dot.rose { background: #efa2b3; }
      .pipeline-count { font-weight: 750; text-align: right; }
      .track { height: 17px; border-radius: 99px; background: #f1f1f4; overflow: hidden; }
      .fill { height: 100%; border-radius: inherit; background: var(--lavender-strong); }
      .fill.blue { background: var(--blue-strong); }
      .fill.mint { background: var(--mint-strong); }
      .fill.peach { background: #f6c571; }
      .fill.rose { background: #efa2b3; }
      .week-nav { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; }
      .week-nav span { margin-right: 7px; }
      .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .day { min-height: 260px; padding: 15px 10px; border-right: 1px solid var(--line); }
      .day:last-child { border-right: 0; }
      .day strong { display: block; font-size: 13px; }
      .day small { display: block; margin: 4px 0 12px; color: var(--muted); font-size: 12px; }
      .event { display: block; padding: 9px; margin: 8px 0; border-radius: 7px; background: var(--lavender); color: var(--ink); font-size: 11px; line-height: 1.35; border-left: 3px solid #8a79ec; }
      .event b { display: block; margin: 3px 0 1px; font-size: 12px; }
      .event span { color: var(--muted); }
      .event.mint { background: var(--mint); border-color: var(--mint-strong); }
      .event.peach { background: var(--peach); border-color: var(--peach-strong); }
      .event.blue { background: var(--blue); border-color: var(--blue-strong); }
      .empty-day { color: #aab0c6; font-size: 12px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
      th { text-align: left; color: var(--muted); background: #fbfbfd; font-weight: 600; white-space: nowrap; }
      th, td { padding: 12px 11px; border-bottom: 1px solid var(--line); }
      tr:last-child td { border-bottom: 0; }
      td { white-space: nowrap; }
      td.role, td.company { font-weight: 650; }
      .company-mark { width: 25px; height: 25px; display: inline-grid; place-items: center; margin-right: 7px; vertical-align: middle; border-radius: 7px; color: #5b51d2; background: var(--lavender); font-weight: 800; }
      .company-mark.mint { background: var(--mint); color: #288159; }
      .company-mark.peach { background: var(--peach); color: #dd7650; }
      .company-mark.blue { background: var(--blue); color: #387cc6; }
      .badge { display: inline-block; padding: 6px 12px; border-radius: 99px; background: var(--lavender); color: #5143b2; font-size: 12px; font-weight: 650; white-space: nowrap; }
      .badge.blue { color: #2871bb; background: var(--blue); }
      .badge.mint { color: #28734d; background: var(--mint); }
      .badge.peach { color: #b65c33; background: var(--peach); }
      .badge.rose { color: #b74a68; background: var(--rose); }
      .badge.gray { color: #63708d; background: #f1f2f5; }
      .toolbar { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .field { display: flex; flex-direction: column; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 600; }
      .field.search { flex: 2; min-width: 250px; }
      .field.small { flex: 1; min-width: 145px; }
      input, select {
        width: 100%; min-height: 43px; padding: 0 13px; border: 1px solid #dedfea;
        border-radius: 10px; background: white; color: var(--ink); font-size: 13px;
      }
      input::placeholder { color: #9aa2b8; }
      .tabs { display: inline-flex; padding: 4px; gap: 3px; border: 1px solid var(--line); border-radius: 11px; }
      .tabs button { border: 0; background: none; color: var(--muted); padding: 8px 14px; border-radius: 8px; font-weight: 650; }
      .tabs button[aria-selected="true"] { background: var(--lavender); color: var(--ink); }
      .board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 13px; overflow-x: auto; }
      .board-column { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfbfd; }
      .board-column h3 { display: flex; justify-content: space-between; padding: 2px 2px 13px; font-family: inherit; }
      .board-job { padding: 14px; margin-bottom: 10px; background: white; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; }
      .board-job strong { display: block; margin-bottom: 6px; }
      .board-job span { color: var(--muted); }
      .split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search-item, .resume-item, .task-item { display: flex; gap: 13px; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
      .search-item:last-child, .resume-item:last-child, .task-item:last-child { border-bottom: 0; }
      .search-item .icon-tile, .resume-item .icon-tile { width: 42px; height: 42px; flex: none; }
      .item-main { min-width: 0; flex: 1; }
      .item-main strong { display: block; font-size: 14px; }
      .item-main small { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
      .candidate-list { display: grid; gap: 10px; }
      .candidate { display: grid; grid-template-columns: 20px 1fr auto auto; align-items: center; gap: 15px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; }
      .candidate input { min-height: auto; width: 17px; height: 17px; accent-color: #6158d9; }
      .candidate strong { display: block; font-size: 13px; }
      .candidate small { display: block; margin-top: 4px; color: var(--muted); }
      .month-layout { grid-template-columns: minmax(0, 3fr) minmax(260px, 1fr); }
      .month-head, .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .month-head span { text-align: center; padding: 11px 0; color: var(--muted); font-size: 12px; }
      .month-cell { min-height: 94px; padding: 8px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); font-size: 12px; }
      .month-cell:nth-child(7n) { border-right: 1px solid var(--line); }
      .month-cell:nth-last-child(-n+7) { border-bottom: 1px solid var(--line); }
      .month-cell.outside { color: #b8bdcb; background: #fcfcfd; }
      .month-cell.today { background: #faf9ff; }
      .month-cell.today .date { color: white; background: #6659db; }
      .date { display: inline-grid; place-items: center; width: 23px; height: 23px; border-radius: 50%; font-weight: 650; }
      .month-event { display: block; margin-top: 5px; padding: 5px; border-radius: 5px; background: var(--lavender); color: #544ab1; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .month-event.mint { background: var(--mint); color: #28734d; }
      .month-event.peach { background: var(--peach); color: #b65c33; }
      .upcoming { display: flex; align-items: start; gap: 11px; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .upcoming:last-child { border: 0; }
      .date-tile { width: 44px; height: 45px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--lavender); font-size: 11px; color: #6053c2; }
      .date-tile strong { display: block; font-size: 19px; line-height: .8; }
      .profile-summary { display: flex; align-items: center; gap: 20px; }
      .profile-avatar { width: 78px; height: 78px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--lavender); color: #4b42ae; font-size: 26px; font-weight: 700; }
      .profile-summary .item-main strong { font-family: Georgia, serif; font-size: 25px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
      .chip { display: inline-block; padding: 9px 12px; border-radius: 9px; background: var(--lavender); color: #5143b2; font-size: 12px; font-weight: 650; }
      .chip:nth-child(3n+2) { background: var(--mint); color: #28734d; }
      .chip:nth-child(3n+3) { background: var(--peach); color: #b65c33; }
      .preference-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .preference-grid div { padding: 14px; background: #fbfbfd; border: 1px solid var(--line); border-radius: 10px; }
      .preference-grid small { display: block; color: var(--muted); margin-bottom: 7px; }
      .preference-grid strong { font-size: 13px; }
      .notice { padding: 12px 14px; border-radius: 10px; background: var(--lavender); color: #5143b2; font-size: 12px; }
      .toast { position: fixed; bottom: 22px; right: 22px; z-index: 50; max-width: 320px; padding: 14px 18px; border-radius: 11px; background: var(--ink); color: white; box-shadow: 0 15px 40px rgb(25 25 55 / 25%); font-size: 13px; }
      .empty { padding: 35px; color: var(--muted); text-align: center; }
      @media (max-width: 1200px) {
        .topbar-inner { flex-wrap: wrap; padding-top: 12px; padding-bottom: 8px; }
        .nav { order: 3; width: 100%; }
        .header-actions { margin-left: auto; }
        .day { min-height: 235px; }
      }
      @media (max-width: 850px) {
        .metrics, .dashboard-middle, .split, .month-layout { grid-template-columns: 1fr; }
        .week-grid { overflow-x: auto; grid-template-columns: repeat(7, minmax(135px, 1fr)); }
        .board { grid-template-columns: repeat(6, 210px); }
        .candidate { grid-template-columns: 20px 1fr auto; }
        .candidate .source { display: none; }
      }
      @media (max-width: 600px) {
        .brand { font-size: 22px; }
        .header-actions .avatar { display: none; }
        .nav-button { padding: 10px; }
        .nav-button .nav-label { display: none; }
        .page-head { align-items: flex-start; }
        .head-date { display: none; }
        .card.pad { padding: 16px; }
        .preference-grid { grid-template-columns: 1fr; }
        .month-cell { min-height: 73px; padding: 4px; }
        .month-event { font-size: 9px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar"><div class="topbar-inner">
      <button class="brand" data-page="dashboard">Smart Job Tracker</button>
      <nav class="nav" aria-label="Main navigation" id="nav"></nav>
      <div class="header-actions"><button class="button primary" data-demo-action="Add job">＋ <span class="add-label">Add job</span></button><span class="avatar" aria-label="Demo profile">JD</span></div>
    </div></header>
    <main class="shell" id="app"></main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      // Standalone visual prototype: all records and actions are local mock data.
      const icons = {
        dashboard: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
        jobs: '<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
        discover: '<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6z"/>',
        applications: '<path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM15 3v5h5M9 13h7M9 17h7"/>',
        calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',
        profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        arrow: '<path d="M4 12h16m-6-6 6 6-6 6"/>',
        chevronLeft: '<path d="m15 5-7 7 7 7"/>',
        chevronRight: '<path d="m9 5 7 7-7 7"/>',
        search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
        plus: '<path d="M12 4v16M4 12h16"/>',
        check: '<path d="m4 12 5 5L20 6"/>',
        location: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2"/>',
        note: '<path d="M7 3h9l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM16 3v5h4M9 13h8M9 17h6"/>',
      };
      const icon = (name, extra = '') => `<svg class="icon ${extra}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
      const pages = [
        ['dashboard', 'Dashboard'], ['jobs', 'Jobs'], ['discover', 'Discover'],
        ['applications', 'Applications'], ['calendar', 'Calendar'], ['profile', 'Profile'],
      ];
      const jobs = [
        { company: 'Rivermind', role: 'Product Designer', status: 'Interview', date: 'Oct 12, 2026', next: 'Phone screen · Oct 12', color: 'blue', mark: 'R' },
        { company: 'NovaHealth', role: 'UX Designer', status: 'Interview', date: 'Oct 10, 2026', next: 'Prepare notes · Oct 12', color: 'mint', mark: 'N' },
        { company: 'Brightpath', role: 'Senior Product Designer', status: 'Interview', date: 'Oct 7, 2026', next: 'Interview · Oct 14', color: 'peach', mark: 'B' },
        { company: 'Crestview', role: 'Product Designer', status: 'Applied', date: 'Oct 5, 2026', next: 'Follow up · Oct 15', color: 'blue', mark: 'C' },
        { company: 'Maple Finance', role: 'UX/UI Designer', status: 'Interview', date: 'Oct 3, 2026', next: 'Phone screen · Oct 16', color: 'mint', mark: 'M' },
        { company: 'Helix Labs', role: 'Product Designer', status: 'Applied', date: 'Oct 1, 2026', next: 'Review portfolio', color: 'peach', mark: 'H' },
        { company: 'Lumen Tech', role: 'UX Researcher', status: 'Offer', date: 'Sep 29, 2026', next: 'Review offer', color: 'blue', mark: 'L' },
        { company: 'Orbit Systems', role: 'Product Designer', status: 'Rejected', date: 'Sep 25, 2026', next: 'Closed', color: 'peach', mark: 'O' },
      ];
      const week = [
        { name: 'Mon', date: 'Oct 12', events: [{ time: '10:00 AM', title: 'Phone screen', company: 'Rivermind', color: '' }, { time: '3:00 PM', title: 'Prepare for interview', company: 'NovaHealth', color: 'peach' }] },
        { name: 'Tue', date: 'Oct 13', events: [{ time: '11:00 AM', title: 'Review offer', company: 'Lumen Tech', color: 'mint' }] },
        { name: 'Wed', date: 'Oct 14', events: [{ time: '2:00 PM', title: 'Interview', company: 'Brightpath', color: '' }] },
        { name: 'Thu', date: 'Oct 15', events: [{ time: 'All day', title: 'Follow up', company: 'Crestview', color: 'peach' }] },
        { name: 'Fri', date: 'Oct 16', events: [{ time: '11:30 AM', title: 'Phone screen', company: 'Maple Finance', color: 'blue' }] },
        { name: 'Sat', date: 'Oct 17', events: [] },
        { name: 'Sun', date: 'Oct 18', events: [] },
      ];
      const badge = (status) => `<span class="badge ${status === 'Interview' ? 'mint' : status === 'Applied' ? '' : status === 'Offer' ? 'peach' : status === 'Rejected' ? 'rose' : 'blue'}">${status}</span>`;
      const metric = (label, value, detail, kind, symbol, spark) => `<div class="card metric ${kind}"><span class="icon-tile">${icon(symbol, 'large')}</span><div class="metric-body"><span class="metric-label">${label}</span><strong class="metric-number">${value}</strong><div class="metric-note">${detail}</div></div>${spark ? `<svg class="spark" viewBox="0 0 85 44" aria-hidden="true"><path d="M3 36 C15 34 18 23 27 28 S42 39 49 24 S66 29 81 5" fill="none" stroke="${spark}" stroke-width="3" stroke-linecap="round"/></svg>` : ''}</div>`;
      const sectionHead = (title, action, page) => `<div class="section-head"><h2>${title}</h2>${action ? `<button class="text-link" data-page="${page}">${action} ${icon('arrow', 'small')}</button>` : ''}</div>`;
      const jobRows = (data = jobs) => data.map(job => `<tr data-job-status="${job.status}"><td class="company"><span class="company-mark ${job.color}">${job.mark}</span>${job.company}</td><td class="role">${job.role}</td><td>${job.date}</td><td>${badge(job.status)}</td><td>${job.next}</td><td><button class="button ghost icon-only" aria-label="More about ${job.company}" data-demo-action="Job details">⋯</button></td></tr>`).join('');
      const jobTable = (data = jobs) => `<div class="table-wrap"><table><thead><tr><th>Company</th><th>Role</th><th>Date applied</th><th>Status</th><th>Next step</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="jobs-body">${jobRows(data)}</tbody></table></div>`;
      const pageHead = (title, subtitle, right = '') => `<div class="page-head"><div><h1>${title}</h1>${subtitle ? `<p>${subtitle}</p>` : ''}</div>${right}</div>`;
      const pipeline = `<div class="card pad">${sectionHead('Pipeline', 'View all', 'jobs')}${[
        ['Wishlist', 3, 'lavender'], ['Applied', 12, 'blue'], ['Interview', 4, 'mint'], ['Offer', 1, 'peach'], ['Rejected', 2, 'rose'],
      ].map(([name, count, color]) => `<div class="pipeline-row"><span class="dot ${color}"></span><span>${name}</span><span class="pipeline-count">${count}</span><div class="track"><div class="fill ${color}" style="width:${Math.max(count * 7, 10)}%"></div></div></div>`).join('')}</div>`;
      const weekCard = `<div class="card pad"><div class="section-head"><h2>This week</h2><div class="week-nav"><span>Oct 12 – Oct 18, 2026</span><button class="button icon-only" aria-label="Previous week" data-demo-action="Previous week">${icon('chevronLeft')}</button><button class="button icon-only" aria-label="Next week" data-demo-action="Next week">${icon('chevronRight')}</button></div></div><div class="week-grid">${week.map(day => `<div class="day"><strong>${day.name}</strong><small>${day.date}</small>${day.events.length ? day.events.map(event => `<div class="event ${event.color}">${event.time}<b>${event.title}</b><span>${event.company}</span></div>`).join('') : '<span class="empty-day">No plans</span>'}</div>`).join('')}</div></div>`;
      function dashboard() {
        return `${pageHead('Overview', '', '<span class="head-date">Mon, Oct 12, 2026</span>')}
          <div class="grid metrics">${metric('Applications this week', '5', '↑ 2 from last week', 'lavender', 'applications')}${metric('Interview rate', '25%', '4 interviews from 16 applications', 'mint', 'calendar', '#519766')}${metric('Waiting for a reply', '3', 'Across your active applications', 'peach', 'clock')}</div>
          <div class="grid dashboard-middle">${pipeline}${weekCard}</div>
          <div class="card pad">${sectionHead('Recent applications', 'View all', 'jobs')}${jobTable(jobs.slice(0, 5))}</div>`;
      }
      function jobsPage() {
        return `${pageHead('Jobs', 'Track and manage your applications in one place.', '<button class="button primary" data-demo-action="Add job">＋ Add job</button>')}
          <div class="card pad toolbar"><label class="field search">Search jobs<input id="job-search" type="search" placeholder="Search companies or roles" /></label><label class="field small">Status<select id="status-filter"><option>All statuses</option><option>Wishlist</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></label><label class="field small">View<select id="sort-jobs"><option>Newest first</option><option>Company A–Z</option></select></label></div>
          <div class="grid metrics">${metric('Total jobs', '22', 'Across all stages', 'lavender', 'jobs')}${metric('Interviews', '4', 'Currently in progress', 'mint', 'calendar')}${metric('Next steps', '6', 'Tasks and reminders', 'peach', 'clock')}</div>
          <div class="card pad"><div class="section-head"><h2>Applications</h2><div class="tabs" role="tablist" aria-label="Job layout"><button role="tab" id="list-tab" aria-selected="true" data-view="list">List</button><button role="tab" id="board-tab" aria-selected="false" data-view="board">Board</button></div></div><div id="jobs-content">${jobTable()}</div></div>`;
      }
      function discover() {
        const searches = [['Product Designer · Berlin', 'Berlin, Germany · Full-time', 'lavender'], ['UX Researcher · Remote', 'Remote · Full-time', 'mint'], ['Senior Product Designer', 'Europe · Hybrid', 'peach']];
        const candidates = [['Product Designer', 'Northstar Studio', 'LinkedIn', 'Possible duplicate'], ['UX Researcher', 'Ridge Analytics', 'Company website', 'New'], ['Senior Product Designer', 'Luma Design', 'LinkedIn', 'New']];
        return `${pageHead('Discover', 'Save searches and review job opportunities before adding them to your tracker.')}
          <div class="grid split" style="margin-bottom:16px"><div class="card pad"><div class="section-head"><div><h2>Saved searches</h2><p>Keep useful search criteria in one place.</p></div><button class="button soft" data-demo-action="New search">＋ New search</button></div>${searches.map(([title, meta, color]) => `<div class="search-item"><span class="icon-tile ${color}">${icon('search')}</span><div class="item-main"><strong>${title}</strong><small>${meta}</small></div><button class="button ghost icon-only" aria-label="Open ${title}" data-demo-action="Open search">${icon('chevronRight')}</button></div>`).join('')}</div>
          <div class="card pad"><div class="section-head"><div><h2>Add candidates</h2><p>Capture a job listing for review.</p></div></div><label class="field">Job posting URL<input type="url" placeholder="https://company.com/careers/..." /></label><p style="color:var(--muted);font-size:12px;margin:12px 0 22px">You can also paste job details in the full intake form.</p><button class="button primary" data-demo-action="Save candidate">Save candidate ${icon('arrow', 'small')}</button></div></div>
          <div class="card pad"><div class="section-head"><div><h2>Import candidates</h2><p>Check details and possible duplicates before importing.</p></div><button class="button primary" data-demo-action="Review selected">Review selected</button></div><div class="candidate-list">${candidates.map(([role, company, source, state], index) => `<label class="candidate"><input type="checkbox" ${index === 0 ? 'checked' : ''}/><span><strong>${role}</strong><small>${company}</small></span><span class="source" style="color:var(--muted);font-size:12px">${source}</span><span class="badge ${state === 'New' ? 'mint' : 'peach'}">${state}</span></label>`).join('')}</div></div>`;
      }
      function applications() {
        const documents = [['Rivermind', 'Product Designer', 'CV · Product Design v3', 'Submitted', 'Oct 12, 2026'], ['NovaHealth', 'UX Designer', 'Portfolio · Research case studies', 'Draft', 'Oct 10, 2026'], ['Brightpath', 'Senior Product Designer', 'Cover letter · Brightpath', 'Submitted', 'Oct 7, 2026'], ['Maple Finance', 'UX/UI Designer', 'CV · UX General v2', 'Ready', 'Oct 3, 2026']];
        return `${pageHead('Applications', 'Review the materials prepared for each application.')}
          <div class="grid metrics">${metric('Submitted', '2', 'Application materials', 'lavender', 'applications')}${metric('Drafts', '1', 'Ready for your review', 'peach', 'note')}${metric('Ready to send', '1', 'Prepared documents', 'mint', 'check')}</div>
          <div class="card pad"><div class="section-head"><h2>Application materials</h2><button class="button soft" data-demo-action="Add document">＋ Add document</button></div><div class="table-wrap"><table><thead><tr><th>Company</th><th>Role</th><th>Document</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>${documents.map(([company, role, document, status, date]) => `<tr><td class="company">${company}</td><td>${role}</td><td>${document}</td><td><span class="badge ${status === 'Submitted' ? 'mint' : status === 'Draft' ? 'peach' : 'blue'}">${status}</span></td><td>${date}</td><td><button class="text-link" data-demo-action="View document">View ${icon('arrow', 'small')}</button></td></tr>`).join('')}</tbody></table></div></div>`;
      }
      function calendar() {
        const items = { 1: [['Portfolio update', 'mint']], 5: [['Application review', '']], 7: [['Interview prep', 'peach']], 12: [['Phone screen', ''], ['Prepare notes', 'peach']], 13: [['Review offer', 'mint']], 14: [['Interview', '']], 15: [['Follow up', 'peach']], 16: [['Phone screen', '']], 20: [['Submit documents', 'mint']], 22: [['Application deadline', 'peach']], 27: [['Follow up', 'peach']] };
        const cells = Array.from({ length: 35 }, (_, index) => { const date = index - 3; const within = date >= 1 && date <= 31; return `<div class="month-cell ${within ? '' : 'outside'} ${date === 12 ? 'today' : ''}"><span class="date">${within ? date : date < 1 ? 30 + date : date - 31}</span>${within ? (items[date] || []).map(([title, color]) => `<span class="month-event ${color}">${title}</span>`).join('') : ''}</div>`; });
        return `${pageHead('Calendar', 'See interviews, reminders, deadlines and next steps together.')}
          <div class="grid month-layout"><div class="card pad"><div class="section-head"><h2>October 2026</h2><div class="week-nav"><button class="button icon-only" aria-label="Previous month" data-demo-action="Previous month">${icon('chevronLeft')}</button><button class="button" data-demo-action="Today">Today</button><button class="button icon-only" aria-label="Next month" data-demo-action="Next month">${icon('chevronRight')}</button></div></div><div class="month-head">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `<span>${day}</span>`).join('')}</div><div class="month-grid">${cells.join('')}</div></div>
          <div class="card pad">${sectionHead('Upcoming', '', '')}${[['12', 'Phone screen', 'Rivermind · 10:00 AM'], ['12', 'Prepare notes', 'NovaHealth · 3:00 PM'], ['13', 'Review offer', 'Lumen Tech · 11:00 AM'], ['14', 'Interview', 'Brightpath · 2:00 PM'], ['15', 'Follow up', 'Crestview · All day'], ['16', 'Phone screen', 'Maple Finance · 11:30 AM']].map(([date, title, detail]) => `<div class="upcoming"><span class="date-tile">OCT<strong>${date}</strong></span><div class="item-main"><strong>${title}</strong><small>${detail}</small></div></div>`).join('')}</div></div>`;
      }
      function profile() {
        const resumes = [['Product Design · General', 'Updated Oct 10, 2026', 'lavender'], ['UX Research Focus', 'Updated Oct 5, 2026', 'mint'], ['Design Leadership', 'Updated Sep 18, 2026', 'peach']];
        return `${pageHead('Profile', 'Keep your experience, skills and job preferences in one place.')}
          <div class="card pad profile-summary" style="margin-bottom:16px"><div class="profile-avatar">JD</div><div class="item-main"><strong>Jordan Davis</strong><small>Product Designer · Berlin, Germany</small><div class="chips"><span class="chip">Product Designer</span><span class="chip">UX Designer</span><span class="chip">Remote friendly</span></div></div><button class="button soft" data-demo-action="Edit profile">Edit profile</button></div>
          <div class="grid split" style="margin-bottom:16px"><div class="card pad"><div class="section-head"><div><h2>Resume library</h2><p>Profiles tailored to different roles.</p></div><button class="button soft" data-demo-action="New resume profile">＋ New</button></div>${resumes.map(([title, date, color]) => `<div class="resume-item"><span class="icon-tile ${color}">${icon('note')}</span><div class="item-main"><strong>${title}</strong><small>${date}</small></div><button class="button ghost" data-demo-action="View resume profile">View</button></div>`).join('')}</div>
          <div class="card pad"><div class="section-head"><div><h2>Skills</h2><p>A reusable inventory for applications.</p></div><button class="button soft" data-demo-action="Add skill">＋ Add skill</button></div><div class="chips">${['React', 'TypeScript', 'UX research', 'Figma', 'Prototyping', 'User testing', 'Design systems', 'Accessibility', 'Stakeholder management'].map(skill => `<span class="chip">${skill}</span>`).join('')}</div></div></div>
          <div class="card pad"><div class="section-head"><h2>Job preferences</h2><button class="text-link" data-demo-action="Edit preferences">Edit preferences ${icon('arrow', 'small')}</button></div><div class="preference-grid"><div><small>Preferred roles</small><strong>Product Designer, UX Designer</strong></div><div><small>Locations</small><strong>Berlin, Germany · Remote</strong></div><div><small>Work arrangement</small><strong>Remote or hybrid</strong></div></div></div>`;
      }
      const renderers = { dashboard, jobs: jobsPage, discover, applications, calendar, profile };
      let currentPage = 'dashboard';
      let jobsView = 'list';
      const app = document.getElementById('app');
      const nav = document.getElementById('nav');
      const toast = document.getElementById('toast');
      let toastTimer;
      function showToast(message) { toast.textContent = message; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 3500); }
      function render(page = 'dashboard') {
        currentPage = renderers[page] ? page : 'dashboard';
        nav.innerHTML = pages.map(([key, title]) => `<button class="nav-button" data-page="${key}" ${key === currentPage ? 'aria-current="page"' : ''}>${icon(key)}<span class="nav-label">${title}</span></button>`).join('');
        app.innerHTML = renderers[currentPage]();
        window.history.replaceState(null, '', `#${currentPage}`);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      function filterJobs() {
        const query = (document.getElementById('job-search')?.value || '').toLowerCase().trim();
        const status = document.getElementById('status-filter')?.value || 'All statuses';
        const order = document.getElementById('sort-jobs')?.value || 'Newest first';
        const filtered = jobs.filter(job => (status === 'All statuses' || job.status === status) && `${job.company} ${job.role}`.toLowerCase().includes(query));
        if (order === 'Company A–Z') filtered.sort((a, b) => a.company.localeCompare(b.company));
        const content = document.getElementById('jobs-content');
        if (!content) return;
        if (!filtered.length) { content.innerHTML = '<div class="empty">No jobs match these filters.</div>'; return; }
        content.innerHTML = jobsView === 'list' ? jobTable(filtered) : `<div class="board">${['Wishlist', 'Applied', 'Interview', 'Offer', 'Rejected', 'Withdrawn'].map(status => `<div class="board-column"><h3>${status}<span>${filtered.filter(job => job.status === status).length}</span></h3>${filtered.filter(job => job.status === status).map(job => `<div class="board-job"><strong>${job.role}</strong><span>${job.company}</span><p style="margin:12px 0 0;color:var(--muted)">${job.next}</p></div>`).join('')}</div>`).join('')}</div>`;
      }
      document.addEventListener('click', event => {
        const pageButton = event.target.closest('[data-page]');
        if (pageButton) { render(pageButton.dataset.page); return; }
        const viewButton = event.target.closest('[data-view]');
        if (viewButton) {
          jobsView = viewButton.dataset.view;
          document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-selected', String(button === viewButton)));
          filterJobs();
          return;
        }
        const demoButton = event.target.closest('[data-demo-action]');
        if (demoButton) showToast(`${demoButton.dataset.demoAction} is a visual preview. No data is saved.`);
      });
      document.addEventListener('input', event => { if (event.target.id === 'job-search') filterJobs(); });
      document.addEventListener('change', event => { if (['status-filter', 'sort-jobs'].includes(event.target.id)) filterJobs(); });
      window.addEventListener('hashchange', () => render(location.hash.slice(1)));
      render(location.hash.slice(1));
    </script>
  </body>
</html>
