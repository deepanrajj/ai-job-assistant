apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-job-tracker-postgres
  labels:
    app.kubernetes.io/name: smart-job-tracker-postgres
    app.kubernetes.io/part-of: smart-job-tracker
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. The data volume is
  # ReadWriteOnce, so a rolling update would start the replacement pod
  # while the old one still holds the mount and leave it stuck pending
  # until the old pod is deleted by hand.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-job-tracker-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-job-tracker-postgres
        app.kubernetes.io/part-of: smart-job-tracker
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: smart-job-tracker-postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-job-tracker-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              # A subdirectory rather than the volume root. A storage
              # class that formats a block device leaves lost+found in
              # that root, and initdb refuses to start in a directory
              # that is not empty.
              subPath: pgdata
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: smart-job-tracker-postgres-data
