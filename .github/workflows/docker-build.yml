name: Docker Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the build because it takes about a second and the
      # build takes minutes. The compose file references both Dockerfile
      # paths, the Nginx upstream hostname from infra/docker/nginx.conf,
      # and the service name that hostname has to match. None of that is
      # checked by the image build, and there is no unit-test harness for
      # a compose file, so this step parses it, interpolates every
      # variable, and resolves the build contexts.
      - name: Validate compose configuration
        run: npm run compose:config

      - name: Build Docker images
        run: npm run docker:build

      # `compose config` above proves the file parses; it binds nothing
      # and starts nothing. Every defect the smoke check exists for is a
      # property of a running stack, so CI has to bring one up or the
      # check only runs when somebody remembers. --wait blocks until
      # every service reports healthy and fails the step if one does not.
      - name: Start the compose stack
        run: docker compose -f infra/docker/compose.yaml up -d --wait

      - name: Check the compose runtime
        run: npm run compose:smoke

      - name: Compose logs
        if: failure()
        run: docker compose -f infra/docker/compose.yaml logs --no-color

      - name: Stop the compose stack
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
