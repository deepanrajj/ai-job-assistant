name: Docker Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the build because it takes about a second and the
      # build takes minutes. The compose file references both Dockerfile
      # paths, the Nginx upstream hostname from infra/docker/nginx.conf,
      # and the service name that hostname has to match. None of that is
      # checked by the image build, and there is no unit-test harness for
      # a compose file, so this step parses it, interpolates every
      # variable, and resolves the build contexts.
      - name: Validate compose configuration
        run: npm run compose:config

      - name: Build Docker images
        run: npm run docker:build

      # `compose config` above proves the file parses; it binds nothing
      # and starts nothing. Every defect the smoke check exists for is a
      # property of a running stack, so CI has to bring one up or the
      # check only runs when somebody remembers. --wait blocks until
      # every service reports healthy and fails the step if one does not.
      - name: Start the compose stack
        run: docker compose -f infra/docker/compose.yaml up -d --wait

      - name: Check the compose runtime
        run: npm run compose:smoke

      # The smoke check proves the stack is up and reachable. This
      # proves the API still behaves, by running the Postman collection
      # that already exists in docs/api/ - create, list, read, update,
      # delete, the 404 after a delete, and a validation failure, with
      # assertions, against the running stack.
      #
      # It runs after the smoke check on purpose. A Newman failure that
      # follows a green smoke check means the API contract moved, not
      # that the stack never came up.
      #
      # The script names the folders it runs. The collection's AI folder
      # reaches OpenAI through the backend and costs money per request,
      # so it must never run here; an allowlist keeps a folder added
      # later from starting to run on its own.
      - name: Run the API collection
        run: npm run api:test

      # if: always() rather than if: failure(). A green report is how
      # the folder allowlist and the assertion count get confirmed
      # without rerunning anything.
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-report
          path: reports/newman
          retention-days: 7

      - name: Compose logs
        if: failure()
        run: docker compose -f infra/docker/compose.yaml logs --no-color

      - name: Stop the compose stack
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
