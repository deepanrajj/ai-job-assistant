name: Docker Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the build because it takes about a second and the
      # build takes minutes. The compose file references both Dockerfile
      # paths, the Nginx upstream hostname from infra/docker/nginx.conf,
      # and the service name that hostname has to match. None of that is
      # checked by the image build, and there is no unit-test harness for
      # a compose file, so this step parses it, interpolates every
      # variable, and resolves the build contexts.
      - name: Validate compose configuration
        run: npm run compose:config

      - name: Build Docker images
        run: npm run docker:build
