name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify frontend
        run: npm run frontend:verify

  backend:
    name: Backend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install root dependencies
        run: npm ci

      - name: Verify backend
        run: npm run backend:verify

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install root dependencies
        run: npm ci

      # Runs separately from Backend Verify because it starts a real
      # PostgreSQL container and so needs Docker, which ubuntu runners
      # provide. Keeping it out of backend:verify is what lets the
      # everyday check stay hermetic.
      - name: Run backend integration tests
        run: npm run backend:test:integration

      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-report
          path: backend/build/reports/tests/integrationTest
          retention-days: 7
