# No datasource settings here on purpose. The PostgreSQL container
# supplies the URL, username, and password through @ServiceConnection,
# and a hardcoded URL would quietly point these tests at something other
# than the container.

# openai
openai.api-key=test-key
openai.base-url=https://api.test
openai.model=gpt-test

# flyway — the migrations are what these tests exercise
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# jpa — flyway manages schema, not hibernate
spring.jpa.hibernate.ddl-auto=none

# hibernate statistics — lets tests assert on statement counts
spring.jpa.properties.hibernate.generate_statistics=true
